{% extends "base.html" %}
{% block title %}Create account · CloudNest{% endblock %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <div class="hero-icon">☁</div>
    <p class="eyebrow">GET STARTED</p>
    <h1>Create your cloud</h1>
    <p class="muted">Make an account to start storing files.</p>
    {% if error %}<div class="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/register" class="form-stack">
      <label>Username<input name="username" required minlength="3" maxlength="50" autocomplete="username"></label>
      <label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"><small>At least 8 characters</small></label>
      <button class="primary" type="submit">Create account</button>
    </form>
    <p class="auth-bottom">Already registered? <a href="/">Sign in</a></p>
  </div>
</section>
{% endblock %}
