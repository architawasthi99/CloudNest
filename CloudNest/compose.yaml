services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cloudnest
      MYSQL_USER: cloudnest
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://cloudnest:${DB_PASSWORD}@db:3306/cloudnest
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      STORAGE_DIR: /code/storage
      MAX_UPLOAD_MB: 25
      COOKIE_HTTPS_ONLY: "false"
    volumes:
      - cloud_files:/code/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
  cloud_files:
